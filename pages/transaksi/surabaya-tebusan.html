<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tebusan / SO – Monitor Stok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/tables.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><p>Memuat Tebusan / SO...</p></div>

<div class="app">
  <div id="sidebar-wrap"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">
        <button class="hamburger" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <h3><i class="bi bi-receipt"></i> Tebusan / SO</h3>
      </div>
      <div id="topbar-user-tag"></div>
    </div>
    <div class="content">
      <div id="alert-bar"></div>
      <div id="page-content"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="confirm-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/state.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/data-service.js"></script>
<script src="../../js/compute.js"></script>
<script src="../../js/utils/dom-helpers.js"></script>
<script src="../../js/utils/export-helpers.js"></script>
<script src="../../js/ui/sidebar.js"></script>
<script src="../../js/app-core.js"></script>
<script src="../../js/ui/surabaya.js"></script>
<script>
_sbyRender = renderSbyTebusan;
function onRealtimeUpdate() {
  if (!document.getElementById('modal-root').innerHTML) setContent(renderSbyTebusan());
}
boot(function() {
  if (me.role !== 'superadmin') {
    setContent('<div class="card"><p style="text-align:center;padding:32px;color:var(--muted)"><i class="bi bi-slash-circle"></i> Hanya Super Admin yang dapat mengakses fitur ini.</p></div>');
    return;
  }
  setContent(renderSbyTebusan());
});
</script>

</body>
</html>
