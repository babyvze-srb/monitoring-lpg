<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Harian – Monitor Stok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/tables.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><p>Memuat Laporan Harian...</p></div>

<div class="app">
  <div id="sidebar-wrap"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">
        <button class="hamburger" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <h3><i class="bi bi-calendar3"></i> Laporan Harian</h3>
      </div>
      <div id="topbar-user-tag"></div>
    </div>
    <div class="content">
      <div id="alert-bar"></div>
      <div id="page-content"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="confirm-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/state.js"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/data-service.js"></script>
<script src="../../js/compute.js"></script>
<script src="../../js/utils/dom-helpers.js"></script>
<script src="../../js/utils/export-helpers.js"></script>
<script src="../../js/ui/sidebar.js"></script>
<script src="../../js/app-core.js"></script>
<script src="../../js/ui/laporan-harian.js"></script>
<script>
var _lhRegion = '';
function onRealtimeUpdate() { if(_lhRegion) setContent(renderLaporanHarian(_lhRegion)); }
boot(function() {
  const q = new URLSearchParams(window.location.search);
  const region = q.get("region") || "";
  const topbar = document.querySelector(".topbar h3");
  if (!region) {
    setContent("<div class=\"card\"><p style=\"text-align:center;padding:32px;color:var(--muted)\"><i class=\"bi bi-exclamation-triangle\"></i> Parameter region tidak ditemukan. Pilih region dari menu sidebar.</p></div>");
    return;
  }
  if (topbar) topbar.textContent = "Laporan Harian – " + region;
  if (me.role !== "superadmin" && me.region !== region) {
    setContent("<div class=\"card\"><p style=\"text-align:center;padding:32px;color:var(--muted)\"><i class=\"bi bi-slash-circle\"></i> Anda tidak memiliki akses ke region ini.</p></div>");
    return;
  }
  _lhRegion = region;
  setContent(renderLaporanHarian(region));
});
</script>

</body>
</html>
