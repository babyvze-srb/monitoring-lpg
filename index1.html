<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring LPG – Multi Region</title>
<style>
  :root {
    --bg:#0f1117;--surface:#1a1d27;--surface2:#232736;--border:#2e3348;
    --accent:#f97316;--accent2:#3b82f6;--accent3:#10b981;
    --danger:#ef4444;--warn:#eab308;--text:#e8eaf0;--muted:#8b91a7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:380px;}
  .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .login-logo h1{font-size:17px;font-weight:700;line-height:1.3;}
  .login-logo span{color:var(--accent);}
  .login-sub{color:var(--muted);font-size:12px;margin-bottom:24px;}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  input,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s;}
  input:focus,select:focus{border-color:var(--accent);}
  .field{margin-bottom:14px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-sm{padding:5px 11px;font-size:11px;border-radius:5px;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-success{background:var(--accent3);color:#fff;}
  .btn-blue{background:var(--accent2);color:#fff;}
  .btn-warn{background:var(--warn);color:#000;}
  .login-err{color:var(--danger);font-size:12px;margin-top:8px;}
  .login-hint{margin-top:18px;padding:12px;background:var(--bg);border-radius:8px;font-size:11px;color:var(--muted);line-height:1.8;}

  /* LAYOUT */
  .app{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
  .sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
  .sidebar-logo h2{font-size:13px;font-weight:700;color:var(--accent);}
  .sidebar-logo small{color:var(--muted);font-size:11px;}
  .sidebar-user{padding:10px 14px;border-bottom:1px solid var(--border);}
  .user-badge{font-size:11px;background:var(--surface2);border-radius:6px;padding:6px 10px;}
  .user-badge .name{font-weight:600;color:var(--text);}
  .user-badge .role{color:var(--muted);}
  nav{flex:1;padding:6px;}
  .nav-section{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 8px 3px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;color:var(--muted);font-size:13px;}
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:rgba(249,115,22,.15);color:var(--accent);font-weight:600;}
  .nav-item .ico{font-size:14px;width:20px;text-align:center;}
  .sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{padding:12px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0;}
  .topbar h3{font-size:15px;font-weight:700;}
  .content{flex:1;overflow-y:auto;padding:20px;}

  /* CARD */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:18px;margin-bottom:18px;}
  .card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px;}
  .stat-card .val{font-size:26px;font-weight:800;line-height:1;}
  .stat-card .lbl{font-size:11px;color:var(--muted);margin-top:4px;}
  .stat-orange{border-left:3px solid var(--accent);}
  .stat-green{border-left:3px solid var(--accent3);}
  .stat-blue{border-left:3px solid var(--accent2);}
  .stat-red{border-left:3px solid var(--danger);}

  /* TABEL MONITORING UTAMA */
  .monitor-wrap{overflow-x:auto;margin-bottom:18px;}
  .monitor-tbl{border-collapse:collapse;min-width:900px;font-size:12px;}
  .monitor-tbl th,.monitor-tbl td{border:1px solid #2e3348;padding:0;}
  .monitor-tbl th{background:#111827;color:#9ca3af;font-weight:700;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;}
  .monitor-tbl td{padding:5px 8px;text-align:center;background:var(--surface);}
  .monitor-tbl .th-group{background:#1e2538;color:#c8ccdb;font-size:11px;padding:7px 8px;}
  .monitor-tbl .th-50{background:rgba(249,115,22,.18);color:#fb923c;}
  .monitor-tbl .th-12{background:rgba(59,130,246,.18);color:#60a5fa;}
  .monitor-tbl .th-55{background:rgba(16,185,129,.18);color:#34d399;}
  .monitor-tbl .region-cell{background:#1e2538;font-weight:700;color:var(--text);padding:0 10px;text-align:left;white-space:nowrap;vertical-align:middle;}
  .monitor-tbl .jenis-isi{background:rgba(16,185,129,.07);color:#34d399;font-weight:700;font-size:10px;letter-spacing:.04em;}
  .monitor-tbl .jenis-kosong{background:rgba(139,145,167,.07);color:#9ca3af;font-weight:700;font-size:10px;letter-spacing:.04em;}
  .monitor-tbl .jenis-bocor{background:rgba(239,68,68,.07);color:#f87171;font-weight:700;font-size:10px;letter-spacing:.04em;}
  .monitor-tbl .stok-cell{background:rgba(234,179,8,.08);color:#fbbf24;font-weight:700;}
  .monitor-tbl .masuk-cell{color:#34d399;}
  .monitor-tbl .keluar-cell{color:#f87171;}
  .monitor-tbl .akhir-cell{font-weight:700;color:var(--text);}
  .monitor-tbl .akhir-neg{color:#ef4444;}
  .monitor-tbl input[type=number]{width:60px;background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.4);border-radius:4px;padding:2px 4px;color:#fbbf24;font-size:11px;font-weight:700;text-align:center;}
  .monitor-tbl .ket-cell{font-size:11px;color:var(--muted);text-align:left;min-width:120px;}

  /* FORM INPUT */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px;}
  .form-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .tag-region{display:inline-flex;align-items:center;gap:4px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);color:var(--accent);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}

  /* BADGE */
  .badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;}
  .badge-isi{background:rgba(16,185,129,.15);color:#10b981;}
  .badge-kosong{background:rgba(139,145,167,.15);color:#8b91a7;}
  .badge-bocor{background:rgba(239,68,68,.15);color:#ef4444;}
  .badge-masuk{background:rgba(16,185,129,.15);color:#10b981;}
  .badge-keluar{background:rgba(249,115,22,.15);color:#f97316;}

  /* MONTH TAB */
  .month-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;}
  .month-tab{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);transition:all .15s;}
  .month-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .month-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

  /* DOWNLOAD BAR */
  .dl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);}
  .dl-bar span{font-size:11px;color:var(--muted);font-weight:600;}

  /* ALERT */
  .alert{padding:9px 12px;border-radius:7px;font-size:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .alert-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#10b981;}
  .alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;}
  .alert-info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#60a5fa;}
  .alert-close{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;color:inherit;opacity:.7;flex-shrink:0;}
  .alert-close:hover{opacity:1;}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:26px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;}
  .modal h4{font-size:15px;font-weight:700;margin-bottom:18px;}

  /* RIWAYAT TABLE */
  .riwayat-tbl{width:100%;border-collapse:collapse;font-size:12px;}
  .riwayat-tbl th{background:var(--bg);color:var(--muted);padding:7px 9px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
  .riwayat-tbl td{padding:8px 9px;border-bottom:1px solid rgba(46,51,72,.5);}
  .riwayat-tbl tr:hover td{background:rgba(255,255,255,.02);}
  .riwayat-tbl tr:last-child td{border-bottom:none;}

  .empty{text-align:center;padding:36px;color:var(--muted);}
  .empty .ico{font-size:32px;margin-bottom:8px;}

  /* HAMBURGER BUTTON */
  .hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--text);font-size:20px;line-height:1;}

  /* SIDEBAR OVERLAY (mobile) */
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;}
  .sidebar-overlay.show{display:block;}

  @media(max-width:768px){
    /* Login */
    .login-card{width:100%;max-width:360px;padding:28px 20px;margin:16px;}

    /* Layout */
    .app{flex-direction:column;}
    .hamburger{display:flex;align-items:center;justify-content:center;}

    /* Sidebar jadi drawer dari kiri */
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;
      width:240px;z-index:50;
      transform:translateX(-100%);
      transition:transform .25s ease;
    }
    .sidebar.open{transform:translateX(0);}

    /* Main area full width */
    .main{width:100%;height:100vh;}

    /* Topbar */
    .topbar{padding:10px 14px;gap:8px;}
    .topbar h3{font-size:13px;}

    /* Content */
    .content{padding:12px;}

    /* Stats grid 2 kolom */
    .stats-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .stat-card .val{font-size:22px;}

    /* Form grid 1 kolom */
    .form-grid{grid-template-columns:1fr;}

    /* Dashboard 2-col grid jadi 1-col */
    .dashboard-grid{grid-template-columns:1fr!important;}

    /* Card */
    .card{padding:12px;}

    /* Month tabs scroll */
    .month-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
    .month-tab{flex-shrink:0;}

    /* Download bar wrap */
    .dl-bar{flex-wrap:wrap;gap:6px;}

    /* Modal full screen di mobile */
    .modal{width:100%;max-width:100%;margin:0;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:85vh;}
    .modal-bg{align-items:flex-end;}

    /* Table scroll hint */
    .monitor-wrap{-webkit-overflow-scrolling:touch;}

    /* Topbar tag */
    .tag-region{font-size:10px;padding:2px 7px;}
  }

  @media(max-width:400px){
    .stats-grid{grid-template-columns:1fr;}
    .topbar h3{font-size:12px;}
  }
</style>
<!-- Loading screen -->
<style>
  #loading-screen{position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;}
  #loading-screen.hide{opacity:0;pointer-events:none;}
  .lds-ring{width:48px;height:48px;position:relative;margin-bottom:16px;}
  .lds-ring div{box-sizing:border-box;display:block;position:absolute;width:40px;height:40px;margin:4px;border:4px solid #f97316;border-radius:50%;animation:lds-ring 1.2s cubic-bezier(.5,0,.5,1) infinite;border-color:#f97316 transparent transparent transparent;}
  .lds-ring div:nth-child(1){animation-delay:-.45s;}
  .lds-ring div:nth-child(2){animation-delay:-.3s;}
  .lds-ring div:nth-child(3){animation-delay:-.15s;}
  @keyframes lds-ring{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  #sb-config-banner{display:none!important;}
</style>
</head>
<body>
<!-- Config banner (shown until Supabase is configured) -->
<div id="sb-config-banner" style="display:none">
  <span style="color:#f97316;font-weight:700">⚙️ Setup Supabase:</span>
  <input id="sb-url" placeholder="Project URL  (https://xxxx.supabase.co)" />
  <input id="sb-key" placeholder="Anon/Public Key" />
  <button class="btn btn-primary btn-sm" onclick="saveSupabaseConfig()">💾 Simpan & Hubungkan</button>
  <a href="https://supabase.com/dashboard" target="_blank" class="btn btn-ghost btn-sm">🔗 Buka Supabase</a>
</div>
<!-- Loading screen -->
<div id="loading-screen">
  <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
  <p style="color:#8b91a7;font-size:13px">Menghubungkan ke database...</p>
</div>
<div id="root"></div>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONSTANTS ===== */
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let REGIONS=['Ternate','Tobelo','Tidore','Morotai','Bacan'];
const TABUNGS=['50 KG','12 KG','5.5 KG'];
const STATUSES=['ISI','KOSONG','BOCOR'];
const CUR_YEAR=new Date().getFullYear();

/* ===== SUPABASE ===== */
const SB_URL='https://mpdtlufbtahnrmzisggs.supabase.co';
const SB_ANON='sb_publishable_0s7XVtHpxblOeZY5uYTyBw_HA1eyie7';
let SB=null;

function getSbConfig(){ return {url:SB_URL,key:SB_ANON}; }
function saveSupabaseConfig(){
  location.reload();
}
async function initSupabase(){
  try{
    SB=supabase.createClient(SB_URL,SB_ANON);
    const {error}=await SB.from('lpg_users').select('id').limit(1);
    if(error) throw error;
    await loadAllData();
    startApp();
  }catch(e){
    console.error('Supabase error:',e);
    document.getElementById('loading-screen').classList.add('hide');
    showErrorPage('❌ Gagal terhubung ke database. Periksa koneksi internet Anda lalu refresh halaman.');
  }
}

function showErrorPage(msg){
  document.getElementById('root').innerHTML=`
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;max-width:420px;width:100%;text-align:center;">
        <div style="font-size:40px;margin-bottom:16px;">🔌</div>
        <p style="color:var(--text);font-size:14px;line-height:1.6;margin-bottom:20px;">${msg}</p>
        <button class="btn btn-primary" onclick="location.reload()" style="width:100%">🔄 Coba Lagi</button>
        <p style="margin-top:12px;font-size:11px;color:var(--muted)">Isi URL & Key Supabase di banner bawah ↓</p>
      </div>
    </div>`;
}

/* ===== STATE ===== */
let S={regions:[],users:[],transactions:[],stokAwal:{}};
let me=null, page='dashboard', alertMsg=null, modalSt=null;
let activeMonth=new Date().getMonth();
let useSupabase=false;

/* ===== LOAD DATA FROM SUPABASE ===== */
async function loadAllData(){
  // Load regions
  const {data:rData}=await SB.from('lpg_regions').select('*').order('sort_order');
  S.regions=(rData||[]).map(r=>r.name);
  if(S.regions.length===0) S.regions=['Ternate','Tobelo','Tidore','Morotai','Bacan'];
  REGIONS.splice(0,REGIONS.length,...S.regions);

  // Load users
  const {data:uData}=await SB.from('lpg_users').select('*');
  S.users=(uData||[]).map(u=>({id:u.id,username:u.username,password:u.password,name:u.name,role:u.role,region:u.region}));
  if(S.users.length===0){
    // Seed default users
    await seedDefaultUsers();
    const {data:u2}=await SB.from('lpg_users').select('*');
    S.users=(u2||[]).map(u=>({id:u.id,username:u.username,password:u.password,name:u.name,role:u.role,region:u.region}));
  }

  // Load transactions
  const {data:tData}=await SB.from('lpg_transactions').select('*').eq('year',CUR_YEAR);
  S.transactions=(tData||[]).map(t=>({
    id:t.id,type:t.type,region:t.region,tanggal:t.tanggal,noSj:t.no_sj,
    pihak:t.pihak,tabung:t.tabung,status:t.status,qty:t.qty,ket:t.ket,
    monthIdx:t.month_idx,year:t.year,createdAt:new Date(t.created_at).getTime()
  }));

  // Load stok awal
  const {data:sData}=await SB.from('lpg_stok_awal').select('*').eq('year',CUR_YEAR);
  S.stokAwal={};
  (sData||[]).forEach(s=>{ S.stokAwal[`${s.region}_${s.tabung}_${s.status}_${s.month_idx}`]=s.qty; });
}

async function seedDefaultUsers(){
  const defaults=[
    {id:'sa',username:'admin',password:'admin123',name:'Super Admin',role:'superadmin',region:null},
    {id:'u1',username:'ternate',password:'ternate123',name:'Operator Ternate',role:'operator',region:'Ternate'},
    {id:'u2',username:'tobelo',password:'tobelo123',name:'Operator Tobelo',role:'operator',region:'Tobelo'},
    {id:'u3',username:'tidore',password:'tidore123',name:'Operator Tidore',role:'operator',region:'Tidore'},
    {id:'u4',username:'morotai',password:'morotai123',name:'Operator Morotai',role:'operator',region:'Morotai'},
    {id:'u5',username:'bacan',password:'bacan123',name:'Operator Bacan',role:'operator',region:'Bacan'},
  ];
  await SB.from('lpg_users').upsert(defaults);

  const defaultRegions=S.regions.map((name,i)=>({name,sort_order:i}));
  await SB.from('lpg_regions').upsert(defaultRegions,{onConflict:'name'});
}

/* ===== SAVE / DELETE (Supabase or localStorage fallback) ===== */
function gid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

// Fallback localStorage
function localSave(){
  localStorage.setItem('lpg_v5_local',JSON.stringify(S));
}
function localLoad(){
  try{ const r=localStorage.getItem('lpg_v5_local'); if(r){const d=JSON.parse(r);Object.assign(S,d);} }catch(e){}
  if(!S.regions||S.regions.length===0) S.regions=['Ternate','Tobelo','Tidore','Morotai','Bacan'];
  if(!S.users||S.users.length===0) S.users=[
    {id:'sa',username:'admin',password:'admin123',name:'Super Admin',role:'superadmin',region:null},
    {id:'u1',username:'ternate',password:'ternate123',name:'Operator Ternate',role:'operator',region:'Ternate'},
    {id:'u2',username:'tobelo',password:'tobelo123',name:'Operator Tobelo',role:'operator',region:'Tobelo'},
    {id:'u3',username:'tidore',password:'tidore123',name:'Operator Tidore',role:'operator',region:'Tidore'},
    {id:'u4',username:'morotai',password:'morotai123',name:'Operator Morotai',role:'operator',region:'Morotai'},
    {id:'u5',username:'bacan',password:'bacan123',name:'Operator Bacan',role:'operator',region:'Bacan'},
  ];
  if(!S.transactions) S.transactions=[];
  if(!S.stokAwal) S.stokAwal={};
  REGIONS.splice(0,REGIONS.length,...S.regions);
}

async function saveTx(tx){
  if(!useSupabase){localSave();return;}
  await SB.from('lpg_transactions').insert({
    id:tx.id,type:tx.type,region:tx.region,tanggal:tx.tanggal,no_sj:tx.noSj,
    pihak:tx.pihak,tabung:tx.tabung,status:tx.status,qty:tx.qty,ket:tx.ket,
    month_idx:tx.monthIdx,year:tx.year
  });
}
async function deleteTx(id){
  if(!useSupabase){S.transactions=S.transactions.filter(t=>t.id!==id);localSave();return;}
  await SB.from('lpg_transactions').delete().eq('id',id);
  S.transactions=S.transactions.filter(t=>t.id!==id);
}
async function saveStokAwal(region,tabung,status,monthIdx,qty){
  const key=`${region}_${tabung}_${status}_${monthIdx}`;
  S.stokAwal[key]=qty;
  if(!useSupabase){localSave();return;}
  await SB.from('lpg_stok_awal').upsert({region,tabung,status,month_idx:monthIdx,year:CUR_YEAR,qty},{onConflict:'region,tabung,status,month_idx,year'});
}
async function saveRegions(){
  if(!useSupabase){localSave();return;}
  const rows=S.regions.map((name,i)=>({name,sort_order:i}));
  await SB.from('lpg_regions').delete().neq('name','__none__');
  await SB.from('lpg_regions').insert(rows);
  // Update REGIONS global
  REGIONS.splice(0,REGIONS.length,...S.regions);
  // Update transactions & users region names handled inline
  if(me&&!S.regions.includes(me.region)&&me.role!=='superadmin') me.region=S.regions[0]||null;
}
async function saveUser(user){
  if(!useSupabase){localSave();return;}
  await SB.from('lpg_users').upsert({id:user.id,username:user.username,password:user.password,name:user.name,role:user.role,region:user.region||null});
}
async function deleteUser(id){
  if(!useSupabase){S.users=S.users.filter(u=>u.id!==id);localSave();return;}
  await SB.from('lpg_users').delete().eq('id',id);
  S.users=S.users.filter(u=>u.id!==id);
}
async function updateTxRegion(oldName,newName){
  if(!useSupabase){localSave();return;}
  await SB.from('lpg_transactions').update({region:newName}).eq('region',oldName);
  await SB.from('lpg_users').update({region:newName}).eq('region',oldName);
  await SB.from('lpg_stok_awal').update({region:newName}).eq('region',oldName);
}

/* ===== APP START ===== */
function startApp(){
  useSupabase=true;
  document.getElementById('loading-screen').classList.add('hide');
  render();
  setupRealtime();
}

function setupRealtime(){
  SB.channel('lpg-changes')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'lpg_transactions'},payload=>{
      const t=payload.new;
      if(t.year===CUR_YEAR && !S.transactions.find(x=>x.id===t.id)){
        S.transactions.push({
          id:t.id,type:t.type,region:t.region,tanggal:t.tanggal,noSj:t.no_sj,
          pihak:t.pihak,tabung:t.tabung,status:t.status,qty:t.qty,ket:t.ket,
          monthIdx:t.month_idx,year:t.year,createdAt:new Date(t.created_at).getTime()
        });
        render();
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'lpg_transactions'},payload=>{
      S.transactions=S.transactions.filter(t=>t.id!==payload.old.id);
      render();
    })
    .subscribe();
}

/* ===== COMPUTATION ===== */
function getTxSum(region,tabung,status,type,monthIdx){
  return S.transactions.filter(t=>
    t.region===region&&t.tabung===tabung&&t.status===status&&
    t.type===type&&t.monthIdx===monthIdx&&t.year===CUR_YEAR
  ).reduce((a,b)=>a+(+b.qty||0),0);
}
function getStokAwal(region,tabung,status,monthIdx){
  if(monthIdx===0) return S.stokAwal[`${region}_${tabung}_${status}_0`]||0;
  const sa=getStokAwal(region,tabung,status,monthIdx-1);
  const m=getTxSum(region,tabung,status,'masuk',monthIdx-1);
  const k=getTxSum(region,tabung,status,'keluar',monthIdx-1);
  return sa+m-k;
}
function computeCell(region,tabung,status,monthIdx){
  const stokAwal=getStokAwal(region,tabung,status,monthIdx);
  const masuk=getTxSum(region,tabung,status,'masuk',monthIdx);
  const keluar=getTxSum(region,tabung,status,'keluar',monthIdx);
  return {stokAwal,masuk,keluar,stokAkhir:stokAwal+masuk-keluar};
}

async function doLogin(){
  const u=document.getElementById('iu').value.trim();
  const p=document.getElementById('ip').value.trim();
  const errEl=document.getElementById('lerr');
  if(!u||!p){errEl.textContent='❌ Username dan password wajib diisi';return;}

  // Blokir jika Supabase tidak terhubung
  if(!SB){
    errEl.textContent='❌ Tidak terhubung ke database. Refresh halaman.';
    return;
  }

  errEl.innerHTML='<span style="color:#8b91a7">⏳ Memeriksa...</span>';
  const btn=document.querySelector('.login-card .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Memeriksa...';}

  try{
    const {data,error}=await SB.from('lpg_users')
      .select('*').eq('username',u).eq('password',p).single();
    if(error||!data){
      errEl.textContent='❌ Username atau password salah';
      if(btn){btn.disabled=false;btn.textContent='Masuk →';}
      return;
    }
    me={id:data.id,username:data.username,password:data.password,name:data.name,role:data.role,region:data.region};
    if(!S.users.find(x=>x.id===me.id)) S.users.push(me);
    page='dashboard';
    render();
  }catch(e){
    errEl.textContent='❌ Koneksi ke database gagal. Coba lagi.';
    if(btn){btn.disabled=false;btn.textContent='Masuk →';}
  }
}

  if(!tgl||!qty||qty<=0){showAlert('❌ Tanggal dan QTY wajib diisi!','error');return;}

  document.getElementById('f-pihak').value='';
  document.getElementById('f-ket').value='';
  showAlert(`✅ Berhasil disimpan! ${tabung} – ${status} – ${qty} tabung`);

function downloadTableById(tableId, filename){
  const tbl=document.getElementById(tableId);
  if(!tbl){alert('Tabel tidak ditemukan');return;}
  // Build clean HTML for download (remove action buttons)
  const clone=tbl.cloneNode(true);
  clone.querySelectorAll('button').forEach(b=>b.closest('td')&&(b.closest('td').textContent=''));
  clone.querySelectorAll('input').forEach(inp=>{
    const span=document.createElement('span');
    span.textContent=inp.value;
    inp.replaceWith(span);
  });
  const html=`<html><head><meta charset="utf-8"><style>
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #999;padding:6px 10px;font-size:12px;text-align:center}
    th{background:#1a1a2e;color:#fff}
    .region-cell{background:#1e2538;font-weight:bold;text-align:left}
  </style></head><body>${clone.outerHTML}</body></html>`;
  const blob=new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${filename}_${new Date().toISOString().split('T')[0]}.xls`;
  a.click();
}

function downloadCSV(monthName, regions){
  const mi=activeMonth;
  const rows=[['GUDANG','JENIS','50KG - STOK AWAL','50KG - MASUK','50KG - KELUAR','50KG - STOK AKHIR','12KG - STOK AWAL','12KG - MASUK','12KG - KELUAR','12KG - STOK AKHIR','5.5KG - STOK AWAL','5.5KG - MASUK','5.5KG - KELUAR','5.5KG - STOK AKHIR']];
  regions.forEach(reg=>{
    STATUSES.forEach(st=>{
      const row=[reg,st];
      TABUNGS.forEach(tab=>{ const d=computeCell(reg,tab,st,mi); row.push(d.stokAwal,d.masuk,d.keluar,d.stokAkhir); });
      rows.push(row);
    });
  });
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Rekap_LPG_${monthName}_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

function printTable(){
  const tbl=document.getElementById('tbl-monitor');
  if(!tbl)return;
  const clone=tbl.cloneNode(true);
  clone.querySelectorAll('input').forEach(inp=>{
    const span=document.createElement('span');
    span.textContent=inp.value;
    inp.replaceWith(span);
  });
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>Rekap LPG ${MONTHS[activeMonth]}</title>
  <style>
    body{font-family:Arial,sans-serif;font-size:11px;color:#000}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #666;padding:5px 8px;text-align:center}
    th{background:#dde;font-weight:bold}
    @media print{@page{size:landscape}}
  </style></head><body>
  <h3 style="margin-bottom:8px">Monitoring LPG – ${MONTHS[activeMonth]} ${CUR_YEAR}</h3>
  ${clone.outerHTML}
  <p style="margin-top:10px;font-size:10px">Dicetak: ${new Date().toLocaleString('id-ID')}</p>
  </body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),500);
}

/* ===== RIWAYAT ===== */
let filtReg='all', filtType='all', filtTab='all';
function renderRiwayat(){
  const isSA=me.role==='superadmin';
  const regs=isSA?(S.regions||REGIONS):(me.region?[me.region]:[]);
  const regOpts=`<option value="all">Semua</option>`+regs.map(r=>`<option value="${r}"${filtReg===r?' selected':''}>${r}</option>`).join('');
  const tabOpts=`<option value="all">Semua</option>`+TABUNGS.map(t=>`<option value="${t}"${filtTab===t?' selected':''}>${t}</option>`).join('');
  let data=[...S.transactions].filter(t=>regs.includes(t.region));
  if(filtReg!=='all') data=data.filter(t=>t.region===filtReg);
  if(filtType!=='all') data=data.filter(t=>t.type===filtType);
  if(filtTab!=='all') data=data.filter(t=>t.tabung===filtTab);
  data.sort((a,b)=>b.createdAt-a.createdAt);
  const rows=data.length?data.map(t=>`<tr>
    <td>${t.tanggal}</td>
    <td><span class="badge badge-${t.type}">${t.type==='masuk'?'📥 Masuk':'📤 Keluar'}</span></td>
    <td>${t.region}</td><td>${t.noSj||'-'}</td><td>${t.pihak||'-'}</td>
    <td style="font-size:11px">${t.tabung}</td>
    <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td>
    <td><b>${t.qty}</b></td><td>${t.ket||'-'}</td>
    <td><button class="btn btn-danger btn-sm" onclick="delTx('${t.id}')">🗑</button></td>
  </tr>`).join(''):`<tr><td colspan="10" class="empty"><div class="ico">📭</div>Tidak ada data</td></tr>`;
  return `
  <div class="card">
    <div class="card-title">🔍 Filter</div>
    <div class="form-grid">
      ${isSA?`<div class="field"><label>Region</label><select onchange="filtReg=this.value;render()">${regOpts}</select></div>`:''}
      <div class="field"><label>Tipe</label><select onchange="filtType=this.value;render()">
        <option value="all">Semua</option><option value="masuk"${filtType==='masuk'?' selected':''}>Masuk</option><option value="keluar"${filtType==='keluar'?' selected':''}>Keluar</option>
      </select></div>
      <div class="field"><label>Jenis Tabung</label><select onchange="filtTab=this.value;render()">${tabOpts}</select></div>
    </div>
    <p style="color:var(--muted);font-size:11px">${data.length} transaksi</p>
  </div>
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between">
      <span>📋 Riwayat Transaksi</span>
      <button class="btn btn-warn btn-sm" onclick="downloadTableById('tbl-riwayat','Riwayat_Transaksi')">⬇ Unduh Excel</button>
    </div>
    <div style="overflow-x:auto">
      <table class="riwayat-tbl" id="tbl-riwayat">
        <tr><th>Tanggal</th><th>Tipe</th><th>Region</th><th>No.SJ</th><th>Supplier/Customer</th><th>Jenis Tabung</th><th>Status</th><th>QTY</th><th>Keterangan</th><th>Aksi</th></tr>
        ${rows}
      </table>
    </div>
  </div>`;
}

/* ===== REGIONS ===== */
function renderRegions(){
  const regs=S.regions||REGIONS;
  const rows=regs.map((r,i)=>{
    const txCount=S.transactions.filter(t=>t.region===r).length;
    const userCount=S.users.filter(u=>u.region===r).length;
    return `<tr>
      <td><b>${i+1}</b></td>
      <td>
        <input id="reg-name-${i}" value="${r}" style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text);font-size:13px;width:180px">
      </td>
      <td style="color:var(--muted)">${txCount} transaksi</td>
      <td style="color:var(--muted)">${userCount} operator</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-blue btn-sm" onclick="renameRegion(${i})">✏️ Simpan</button>
          ${txCount===0&&userCount===0?`<button class="btn btn-danger btn-sm" onclick="deleteRegion(${i})">🗑 Hapus</button>`:`<span style="font-size:11px;color:var(--muted);padding:5px 4px">Ada data</span>`}
        </div>
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between">
      <span>🗂️ Daftar Region / Gudang</span>
      <button class="btn btn-primary btn-sm" onclick="modalSt={t:'addRegion'};render()">+ Tambah Region</button>
    </div>
    <table class="riwayat-tbl">
      <tr><th>#</th><th>Nama Region</th><th>Transaksi</th><th>Operator</th><th>Aksi</th></tr>
      ${rows}
    </table>
  </div>
  <div class="alert alert-info">ℹ️ Region yang sudah memiliki data transaksi atau operator tidak bisa dihapus. Rename tetap bisa dilakukan. Setelah menambah region baru, buat akun operator di menu <b>Kelola User</b>.</div>`;
}

async function renameRegion(idx){
  const inp=document.getElementById('reg-name-'+idx);
  if(!inp)return;
  const newName=inp.value.trim();
  if(!newName){showAlert('❌ Nama region tidak boleh kosong','error');return;}
  const oldName=S.regions[idx];
  if(newName===oldName){showAlert('Nama sama, tidak ada perubahan','error');return;}
  if(S.regions.includes(newName)){showAlert('❌ Nama region sudah ada!','error');return;}
  S.regions[idx]=newName;
  S.transactions.forEach(t=>{ if(t.region===oldName)t.region=newName; });
  S.users.forEach(u=>{ if(u.region===oldName)u.region=newName; });
  const newStok={};
  Object.entries(S.stokAwal).forEach(([k,v])=>{ newStok[k.replace(oldName+'_',newName+'_')]=v; });
  S.stokAwal=newStok;
  if(me&&me.region===oldName)me.region=newName;
  REGIONS.splice(0,REGIONS.length,...S.regions);
  await updateTxRegion(oldName,newName);
  await saveRegions();
  showAlert(`✅ Region "${oldName}" berhasil diubah menjadi "${newName}"`);
}

async function deleteRegion(idx){
  const name=S.regions[idx];
  if(!confirm(`Hapus region "${name}"? Tindakan ini tidak bisa dibatalkan.`))return;
  S.regions.splice(idx,1);
  REGIONS.splice(0,REGIONS.length,...S.regions);
  if(useSupabase) await SB.from('lpg_regions').delete().eq('name',name);
  else localSave();
  showAlert(`🗑️ Region "${name}" dihapus`);
  render();
}

async function addRegion(){
  const inp=document.getElementById('m-reg-new');
  if(!inp)return;
  const name=inp.value.trim();
  if(!name){showAlert('❌ Nama region tidak boleh kosong','error');return;}
  if(S.regions.includes(name)){showAlert('❌ Region sudah ada!','error');return;}
  S.regions.push(name);
  REGIONS.splice(0,REGIONS.length,...S.regions);
  await saveRegions();
  modalSt=null;
  showAlert(`✅ Region "${name}" berhasil ditambahkan!`);
}

/* ===== USERS ===== */
function renderUsers(){
  const rows=S.users.map(u=>`<tr>
    <td>${u.username}</td><td>${u.name}</td>
    <td><span class="badge ${u.role==='superadmin'?'badge-isi':'badge-kosong'}">${u.role==='superadmin'?'Super Admin':'Operator'}</span></td>
    <td>${u.region||'—'}</td>
    <td>${u.id!=='sa'?`<button class="btn btn-danger btn-sm" onclick="delUser('${u.id}')">🗑</button>`:'-'}</td>
  </tr>`).join('');
  return `
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between">
      <span>👥 Daftar User</span>
      <button class="btn btn-primary btn-sm" onclick="modalSt={t:'addUser'};render()">+ Tambah User</button>
    </div>
    <table class="riwayat-tbl">
      <tr><th>Username</th><th>Nama</th><th>Role</th><th>Region</th><th>Aksi</th></tr>
      ${rows}
    </table>
  </div>

}
async function delUser(id){
  if(!confirm('Hapus user ini?'))return;
  await deleteUser(id);
  showAlert('🗑️ User dihapus');
  render();
}

/* ===== MODAL ===== */
function renderModal(){
  if(!modalSt)return'';
  if(modalSt.t==='addRegion'){
    return `<div class="modal-bg" onclick="if(event.target===this){modalSt=null;render()}">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <h4 style="margin:0">🗂️ Tambah Region Baru</h4>
          <button class="alert-close" style="font-size:18px" onclick="modalSt=null;render()" title="Tutup">&#x2715;</button>
        </div>
        <div class="field"><label>Nama Region / Gudang</label><input id="m-reg-new" placeholder="Contoh: Halmahera Selatan" autofocus></div>
        <p style="font-size:11px;color:var(--muted);margin-bottom:16px">Nama akan muncul di menu rekap dan sebagai pilihan saat input transaksi.</p>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="addRegion()">&#x2705; Tambah Region</button>
          <button class="btn btn-ghost" onclick="modalSt=null;render()">Batal</button>
        </div>
      </div>
    </div>`;
  }
  if(modalSt.t==='addUser'){
    const regOpts=(S.regions||REGIONS).map(r=>`<option value="${r}">${r}</option>`).join('');
    return `<div class="modal-bg" onclick="if(event.target===this){modalSt=null;render()}">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <h4 style="margin:0">&#x1F464; Tambah User Baru</h4>
          <button class="alert-close" style="font-size:18px" onclick="modalSt=null;render()" title="Tutup">&#x2715;</button>
        </div>
        <div class="field"><label>Nama Lengkap</label><input id="mn" placeholder="Nama lengkap..."></div>
        <div class="field"><label>Username</label><input id="mu" placeholder="username (tanpa spasi)"></div>
        <div class="field"><label>Password</label><input id="mp" type="password" placeholder="password"></div>
        <div class="field"><label>Role</label>
          <select id="mr" onchange="document.getElementById('mrw').style.display=this.value==='superadmin'?'none':'block'">
            <option value="operator">Operator</option>
            <option value="superadmin">Super Admin</option>
          </select>
        </div>
        <div class="field" id="mrw"><label>Region Gudang</label><select id="mreg">${regOpts}</select></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-primary" onclick="saveUser()">&#x1F4BE; Simpan</button>
          <button class="btn btn-ghost" onclick="modalSt=null;render()">Batal</button>
        </div>
      </div>
    </div>`;
  }
  return'';
}
async function saveUser(){
  const name=document.getElementById('mn').value.trim();
  const username=document.getElementById('mu').value.trim();
  const password=document.getElementById('mp').value.trim();
  const role=document.getElementById('mr').value;
  const region=role==='superadmin'?null:document.getElementById('mreg').value;
  if(!name||!username||!password){alert('Semua field wajib diisi!');return;}
  if(S.users.find(u=>u.username===username)){alert('Username sudah dipakai!');return;}
  const newUser={id:gid(),username,password,name,role,region};
  S.users.push(newUser);
  await saveUser_sb(newUser);
  modalSt=null; showAlert('✅ User berhasil ditambahkan!');
}
async function saveUser_sb(user){
  if(!useSupabase){localSave();return;}
  await SB.from('lpg_users').insert({id:user.id,username:user.username,password:user.password,name:user.name,role:user.role,region:user.region||null});
}

initSupabase();
