<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring LPG – Multi Region</title>
<style>
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#232736;--border:#2e3348;
    --accent:#f97316;--accent2:#3b82f6;--accent3:#10b981;
    --danger:#ef4444;--warn:#eab308;--text:#e8eaf0;--muted:#8b91a7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}

  /* LAYOUT */
  .app{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:224px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
  .sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
  .sidebar-logo h2{font-size:13px;font-weight:700;color:var(--accent);}
  .sidebar-logo small{color:var(--muted);font-size:11px;}
  .sidebar-user{padding:10px 14px;border-bottom:1px solid var(--border);}
  .user-badge{font-size:11px;background:var(--surface2);border-radius:8px;padding:8px 11px;}
  .user-badge .name{font-weight:700;color:var(--text);font-size:12px;}
  .user-badge .role{color:var(--muted);margin-top:1px;}
  nav{flex:1;padding:6px;}
  .nav-section{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 8px 3px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;color:var(--muted);font-size:13px;}
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:rgba(249,115,22,.15);color:var(--accent);font-weight:600;}
  .nav-item .ico{font-size:14px;width:20px;text-align:center;}
  .sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{padding:12px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0;}
  .topbar h3{font-size:15px;font-weight:700;}
  .content{flex:1;overflow-y:auto;padding:20px;}

  /* CARD */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:18px;margin-bottom:18px;}
  .card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px;}
  .stat-card .val{font-size:26px;font-weight:800;line-height:1;}
  .stat-card .lbl{font-size:11px;color:var(--muted);margin-top:4px;}
  .stat-orange{border-left:3px solid var(--accent);}
  .stat-green{border-left:3px solid var(--accent3);}
  .stat-blue{border-left:3px solid var(--accent2);}
  .stat-red{border-left:3px solid var(--danger);}

  /* TABEL */
  .monitor-wrap{overflow-x:auto;margin-bottom:18px;}
  .monitor-tbl{border-collapse:collapse;min-width:900px;font-size:12px;}
  .monitor-tbl th,.monitor-tbl td{border:1px solid #2e3348;padding:0;}
  .monitor-tbl th{background:#111827;color:#9ca3af;font-weight:700;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;}
  .monitor-tbl td{padding:5px 8px;text-align:center;background:var(--surface);}
  .monitor-tbl .th-group{background:#1e2538;color:#c8ccdb;font-size:11px;padding:7px 8px;}
  .monitor-tbl .th-50{background:rgba(249,115,22,.18);color:#fb923c;}
  .monitor-tbl .th-12{background:rgba(59,130,246,.18);color:#60a5fa;}
  .monitor-tbl .th-55{background:rgba(16,185,129,.18);color:#34d399;}
  .monitor-tbl .region-cell{background:#1e2538;font-weight:700;color:var(--text);padding:0 10px;text-align:left;white-space:nowrap;vertical-align:middle;}
  .monitor-tbl .jenis-isi{background:rgba(16,185,129,.07);color:#34d399;font-weight:700;font-size:10px;letter-spacing:.04em;}
  .monitor-tbl .jenis-kosong{background:rgba(139,145,167,.07);color:#9ca3af;font-weight:700;font-size:10px;letter-spacing:.04em;}
  .monitor-tbl .jenis-bocor{background:rgba(239,68,68,.07);color:#f87171;font-weight:700;font-size:10px;letter-spacing:.04em;}
  .monitor-tbl .stok-cell{background:rgba(234,179,8,.08);color:#fbbf24;font-weight:700;}
  .monitor-tbl .masuk-cell{color:#34d399;}
  .monitor-tbl .keluar-cell{color:#f87171;}
  .monitor-tbl .akhir-cell{font-weight:700;color:var(--text);}
  .monitor-tbl .akhir-neg{color:#ef4444;}
  .monitor-tbl input[type=number]{width:60px;background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.4);border-radius:4px;padding:2px 4px;color:#fbbf24;font-size:11px;font-weight:700;text-align:center;}
  .monitor-tbl .ket-cell{font-size:11px;color:var(--muted);text-align:left;min-width:120px;}

  /* FORM */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px;}
  .form-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .tag-region{display:inline-flex;align-items:center;gap:4px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);color:var(--accent);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  input,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s;}
  input:focus,select:focus{border-color:var(--accent);}
  .field{margin-bottom:14px;}

  /* BADGE */
  .badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;}
  .badge-isi{background:rgba(16,185,129,.15);color:#10b981;}
  .badge-kosong{background:rgba(139,145,167,.15);color:#8b91a7;}
  .badge-bocor{background:rgba(239,68,68,.15);color:#ef4444;}
  .badge-masuk{background:rgba(16,185,129,.15);color:#10b981;}
  .badge-keluar{background:rgba(249,115,22,.15);color:#f97316;}

  /* BTN */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-sm{padding:5px 11px;font-size:11px;border-radius:5px;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-success{background:var(--accent3);color:#fff;}
  .btn-blue{background:var(--accent2);color:#fff;}
  .btn-warn{background:var(--warn);color:#000;}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}

  /* ALERT */
  .alert{padding:9px 12px;border-radius:7px;font-size:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .alert-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#10b981;}
  .alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;}
  .alert-info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#60a5fa;}
  .alert-close{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;color:inherit;opacity:.7;flex-shrink:0;}
  .alert-close:hover{opacity:1;}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px);}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:500px;max-width:95vw;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .modal h4{font-size:15px;font-weight:700;margin-bottom:18px;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-header h4{margin:0;font-size:15px;font-weight:700;}
  .modal-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);padding:2px 6px;border-radius:5px;transition:color .15s,background .15s;}
  .modal-close:hover{color:var(--text);background:var(--surface2);}

  /* KONFIRMASI DIALOG */
  .confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
  .confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 26px;width:380px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center;animation:popIn .2s ease;}
  @keyframes popIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  .confirm-box .ico{font-size:36px;margin-bottom:12px;}
  .confirm-box h5{font-size:14px;font-weight:700;margin-bottom:8px;}
  .confirm-box p{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
  .confirm-btns{display:flex;gap:8px;justify-content:center;}

  /* RIWAYAT TABLE */
  .riwayat-tbl{width:100%;border-collapse:collapse;font-size:12px;}
  .riwayat-tbl th{background:var(--bg);color:var(--muted);padding:7px 9px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
  .riwayat-tbl td{padding:8px 9px;border-bottom:1px solid rgba(46,51,72,.5);}
  .riwayat-tbl tr:hover td{background:rgba(255,255,255,.02);}
  .riwayat-tbl tr:last-child td{border-bottom:none;}

  .empty{text-align:center;padding:36px;color:var(--muted);}
  .empty .ico{font-size:32px;margin-bottom:8px;}

  /* MONTH TAB */
  .month-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;}
  .month-tab{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);transition:all .15s;}
  .month-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .month-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

  /* DOWNLOAD BAR */
  .dl-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);}
  .dl-bar span{font-size:11px;color:var(--muted);font-weight:600;}

  /* HAMBURGER */
  .hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;color:var(--text);font-size:20px;line-height:1;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;}
  .sidebar-overlay.show{display:block;}

  @media(max-width:768px){
    .app{flex-direction:column;}
    .hamburger{display:flex;align-items:center;justify-content:center;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:50;transform:translateX(-100%);transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .main{width:100%;height:100vh;}
    .topbar{padding:10px 14px;gap:8px;}
    .topbar h3{font-size:13px;}
    .content{padding:12px;}
    .stats-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .stat-card .val{font-size:22px;}
    .form-grid{grid-template-columns:1fr;}
    .dashboard-grid{grid-template-columns:1fr!important;}
    .card{padding:12px;}
    .month-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
    .month-tab{flex-shrink:0;}
    .dl-bar{flex-wrap:wrap;gap:6px;}
    .modal{width:100%;max-width:100%;margin:0;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:85vh;}
    .modal-bg{align-items:flex-end;}
    .monitor-wrap{-webkit-overflow-scrolling:touch;}
    .tag-region{font-size:10px;padding:2px 7px;}
  }
  @media(max-width:400px){
    .stats-grid{grid-template-columns:1fr;}
    .topbar h3{font-size:12px;}
  }

  /* IMPORT */
  #import-dropzone{border:2px dashed var(--border);border-radius:10px;padding:32px;text-align:center;cursor:pointer;transition:.2s;}
  #import-dropzone:hover{border-color:var(--accent);background:rgba(249,115,22,.04);}

  /* SUPABASE CONFIG INPUT */
  .sb-config-card{background:var(--surface);border:1px solid rgba(249,115,22,.4);border-radius:14px;padding:28px;max-width:480px;width:100%;margin:0 auto;}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen" style="position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;">
  <div style="width:48px;height:48px;position:relative;margin-bottom:16px;">
    <style>.lr div{box-sizing:border-box;display:block;position:absolute;width:40px;height:40px;margin:4px;border:4px solid #f97316;border-radius:50%;animation:lr 1.2s cubic-bezier(.5,0,.5,1) infinite;border-color:#f97316 transparent transparent transparent;}
    .lr div:nth-child(1){animation-delay:-.45s;}.lr div:nth-child(2){animation-delay:-.3s;}.lr div:nth-child(3){animation-delay:-.15s;}
    @keyframes lr{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}</style>
    <div class="lr"><div></div><div></div><div></div><div></div></div>
  </div>
  <p style="color:#8b91a7;font-size:13px">Memuat aplikasi...</p>
</div>

<div id="root"></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONSTANTS ===== */
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let REGIONS=['Ternate','Tobelo','Tidore','Morotai','Bacan'];
const TABUNGS=['50 KG','12 KG','5.5 KG'];
const STATUSES=['ISI','KOSONG','BOCOR'];
const CUR_YEAR=new Date().getFullYear();

/* ===== SUPABASE ===== */
const SB_URL='https://mpdtlufbtahnrmzisggs.supabase.co';
const SB_ANON='sb_publishable_0s7XVtHpxblOeZY5uYTyBw_HA1eyie7';
let SB=null;

/* ===== STATE ===== */
let S={regions:[],users:[],transactions:[],stokAwal:{}};
let me=null, page='dashboard', alertMsg=null, modalSt=null;
let activeMonth=new Date().getMonth();
let useSupabase=false;

/* ===== BOOT ===== */
async function boot(){
  // Cek session
  const sess=sessionStorage.getItem('lpg_me');
  if(sess){
    try{ me=JSON.parse(sess); }catch(e){ me=null; }
  }
  if(!me){
    // Redirect ke login
    window.location.href='login.html';
    return;
  }

  // Init Supabase
  try{
    SB=supabase.createClient(SB_URL,SB_ANON);
    const {error}=await SB.from('lpg_users').select('id').limit(1);
    if(error) throw error;
    await loadAllData();
    useSupabase=true;
    document.getElementById('loading-screen').style.opacity='0';
    setTimeout(()=>document.getElementById('loading-screen').style.display='none',400);
    render();
    setupRealtime();
  }catch(e){
    console.error(e);
    document.getElementById('loading-screen').style.display='none';
    showErrorPage('❌ Gagal terhubung ke database. Periksa koneksi internet lalu refresh halaman.');
  }
}

function showErrorPage(msg){
  document.getElementById('root').innerHTML=`
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;max-width:420px;width:100%;text-align:center;">
        <div style="font-size:40px;margin-bottom:16px;">🔌</div>
        <p style="color:var(--text);font-size:14px;line-height:1.6;margin-bottom:20px;">${msg}</p>
        <button class="btn btn-primary" onclick="location.reload()" style="width:100%">🔄 Coba Lagi</button>
      </div>
    </div>`;
}

/* ===== LOAD DATA ===== */
async function loadAllData(){
  const {data:rData}=await SB.from('lpg_regions').select('*').order('sort_order');
  S.regions=(rData||[]).map(r=>r.name);
  if(S.regions.length===0) S.regions=['Ternate','Tobelo','Tidore','Morotai','Bacan'];
  REGIONS.splice(0,REGIONS.length,...S.regions);

  const {data:uData}=await SB.from('lpg_users').select('*');
  S.users=(uData||[]).map(u=>({id:u.id,username:u.username,password:u.password,name:u.name,role:u.role,region:u.region}));
  if(S.users.length===0) await seedDefaultUsers();

  const {data:tData}=await SB.from('lpg_transactions').select('*').eq('year',CUR_YEAR);
  S.transactions=(tData||[]).map(t=>({
    id:t.id,type:t.type,region:t.region,tanggal:t.tanggal,noSj:t.no_sj,
    pihak:t.pihak,tabung:t.tabung,status:t.status,qty:t.qty,ket:t.ket,
    monthIdx:t.month_idx,year:t.year,createdAt:new Date(t.created_at).getTime()
  }));

  const {data:sData}=await SB.from('lpg_stok_awal').select('*').eq('year',CUR_YEAR);
  S.stokAwal={};
  (sData||[]).forEach(s=>{ S.stokAwal[`${s.region}_${s.tabung}_${s.status}_${s.month_idx}`]=s.qty; });
}

async function seedDefaultUsers(){
  const defaults=[
    {id:'sa',username:'admin',password:'admin123',name:'Super Admin',role:'superadmin',region:null},
    {id:'u1',username:'ternate',password:'ternate123',name:'Operator Ternate',role:'operator',region:'Ternate'},
    {id:'u2',username:'tobelo',password:'tobelo123',name:'Operator Tobelo',role:'operator',region:'Tobelo'},
    {id:'u3',username:'tidore',password:'tidore123',name:'Operator Tidore',role:'operator',region:'Tidore'},
    {id:'u4',username:'morotai',password:'morotai123',name:'Operator Morotai',role:'operator',region:'Morotai'},
    {id:'u5',username:'bacan',password:'bacan123',name:'Operator Bacan',role:'operator',region:'Bacan'},
  ];
  await SB.from('lpg_users').upsert(defaults);
  const defaultRegions=S.regions.map((name,i)=>({name,sort_order:i}));
  await SB.from('lpg_regions').upsert(defaultRegions,{onConflict:'name'});
  const {data:u2}=await SB.from('lpg_users').select('*');
  S.users=(u2||[]).map(u=>({id:u.id,username:u.username,password:u.password,name:u.name,role:u.role,region:u.region}));
}

/* ===== REALTIME ===== */
function setupRealtime(){
  SB.channel('lpg-changes')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'lpg_transactions'},payload=>{
      const t=payload.new;
      if(t.year===CUR_YEAR && !S.transactions.find(x=>x.id===t.id)){
        S.transactions.push({id:t.id,type:t.type,region:t.region,tanggal:t.tanggal,noSj:t.no_sj,
          pihak:t.pihak,tabung:t.tabung,status:t.status,qty:t.qty,ket:t.ket,
          monthIdx:t.month_idx,year:t.year,createdAt:new Date(t.created_at).getTime()});
        render();
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'lpg_transactions'},payload=>{
      S.transactions=S.transactions.filter(t=>t.id!==payload.old.id);
      render();
    })
    .subscribe();
}

/* ===== HELPERS ===== */
function gid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

async function saveTx(tx){
  if(!useSupabase) return;
  await SB.from('lpg_transactions').insert({
    id:tx.id,type:tx.type,region:tx.region,tanggal:tx.tanggal,no_sj:tx.noSj,
    pihak:tx.pihak,tabung:tx.tabung,status:tx.status,qty:tx.qty,ket:tx.ket,
    month_idx:tx.monthIdx,year:tx.year
  });
}
async function deleteTx(id){
  if(!useSupabase){ S.transactions=S.transactions.filter(t=>t.id!==id); return; }
  await SB.from('lpg_transactions').delete().eq('id',id);
  S.transactions=S.transactions.filter(t=>t.id!==id);
}
async function saveStokAwal(region,tabung,status,monthIdx,qty){
  const key=`${region}_${tabung}_${status}_${monthIdx}`;
  const oldQty=S.stokAwal[key]||0;
  S.stokAwal[key]=qty;
  if(!useSupabase) return;
  await SB.from('lpg_stok_awal').upsert({region,tabung,status,month_idx:monthIdx,year:CUR_YEAR,qty},{onConflict:'region,tabung,status,month_idx,year'});
  if(oldQty!==qty) await writeLog('UBAH_STOK_AWAL',`${region} – ${tabung} – ${status} – Bulan: ${MONTHS[monthIdx]} | ${oldQty} → ${qty}`);
}
async function saveRegions(){
  if(!useSupabase) return;
  const rows=S.regions.map((name,i)=>({name,sort_order:i}));
  await SB.from('lpg_regions').delete().neq('name','__none__');
  await SB.from('lpg_regions').insert(rows);
  REGIONS.splice(0,REGIONS.length,...S.regions);
}
async function deleteUser(id){
  if(!useSupabase){ S.users=S.users.filter(u=>u.id!==id); return; }
  await SB.from('lpg_users').delete().eq('id',id);
  S.users=S.users.filter(u=>u.id!==id);
}
async function updateTxRegion(oldName,newName){
  if(!useSupabase) return;
  await SB.from('lpg_transactions').update({region:newName}).eq('region',oldName);
  await SB.from('lpg_users').update({region:newName}).eq('region',oldName);
  await SB.from('lpg_stok_awal').update({region:newName}).eq('region',oldName);
}
async function writeLog(action,detail=''){
  if(!useSupabase||!me) return;
  try{
    await SB.from('lpg_activity_log').insert({
      id:gid(),user_id:me.id,username:me.username,name:me.name,
      role:me.role,region:me.region||null,action,detail,
      created_at:new Date().toISOString()
    });
  }catch(e){}
}

/* ===== COMPUTATION ===== */
function getTxSum(region,tabung,status,type,monthIdx){
  return S.transactions.filter(t=>t.region===region&&t.tabung===tabung&&t.status===status&&t.type===type&&t.monthIdx===monthIdx&&t.year===CUR_YEAR).reduce((a,b)=>a+(+b.qty||0),0);
}
function getStokAwal(region,tabung,status,monthIdx){
  if(monthIdx===0) return S.stokAwal[`${region}_${tabung}_${status}_0`]||0;
  const sa=getStokAwal(region,tabung,status,monthIdx-1);
  const m=getTxSum(region,tabung,status,'masuk',monthIdx-1);
  const k=getTxSum(region,tabung,status,'keluar',monthIdx-1);
  return sa+m-k;
}
function computeCell(region,tabung,status,monthIdx){
  const stokAwal=getStokAwal(region,tabung,status,monthIdx);
  const masuk=getTxSum(region,tabung,status,'masuk',monthIdx);
  const keluar=getTxSum(region,tabung,status,'keluar',monthIdx);
  return {stokAwal,masuk,keluar,stokAkhir:stokAwal+masuk-keluar};
}

async function submitTx(type){
  const isSA=me.role==='superadmin';
  const tgl=document.getElementById('f-tgl').value;
  const region=isSA?document.getElementById('f-reg').value:me.region;
  if(!isSA&&!region){showAlert('❌ Akun Anda tidak memiliki region. Hubungi admin.','error');return;}
  const noSj=document.getElementById('f-sj').value.trim();
  const pihak=document.getElementById('f-pihak').value.trim();
  const tabung=document.getElementById('f-tab').value;
  const status=document.getElementById('f-st').value;
  const qty=parseInt(document.getElementById('f-qty').value);
  const ket=document.getElementById('f-ket').value.trim();
  if(!tgl||!qty||qty<=0){showAlert('❌ Tanggal dan QTY wajib diisi!','error');return;}
  const d=new Date(tgl);
  const tx={id:gid(),type,region,tanggal:tgl,noSj,pihak,tabung,status,qty,ket,monthIdx:d.getMonth(),year:d.getFullYear(),createdAt:Date.now()};
  S.transactions.push(tx);
  await saveTx(tx);
  await writeLog(type==='masuk'?'BARANG_MASUK':'BARANG_KELUAR',
    `${tabung} – ${status} – ${qty} tabung | Region: ${region} | No.SJ: ${noSj||'-'} | ${type==='masuk'?'Supplier':'Customer'}: ${pihak||'-'}`);
  ['f-qty','f-sj','f-pihak','f-ket'].forEach(id=>{ const el=document.getElementById(id); if(el)el.value=''; });
  showAlert(`✅ Berhasil disimpan! ${tabung} – ${status} – ${qty} tabung`);
}

function confirmDelTx(id){
  const tx=S.transactions.find(t=>t.id===id);
  showConfirm({
    ico:'🗑️',title:'Hapus Transaksi',
    msg:`Yakin hapus transaksi <b>${tx?tx.tabung+' '+tx.status+' '+tx.qty+' tabung':''}</b>?<br>Tindakan ini tidak bisa dibatalkan.`,
    confirmLabel:'Ya, Hapus',
    confirmClass:'btn-danger',
    onConfirm:async()=>{
      await deleteTx(id);
      if(tx) await writeLog('HAPUS_TRANSAKSI',`${tx.type} – ${tx.tabung} – ${tx.status} – ${tx.qty} tabung | Region: ${tx.region}`);
      showAlert('🗑️ Transaksi dihapus');
    }
  });
}

function handleCSVDrop(e){ const f=e.dataTransfer.files[0]; if(f)parseCSVFile(f); }
function handleCSVFile(inp){ const f=inp.files[0]; if(f)parseCSVFile(f); inp.value=''; }

function parseCSVFile(file){
  if(!file.name.endsWith('.csv')){showAlert('❌ File harus berformat .csv','error');return;}
  if(file.size>5*1024*1024){showAlert('❌ File terlalu besar (maks 5MB)','error');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result.replace(/\r/g,'');
    const lines=text.split('\n').filter(l=>l.trim());
    if(lines.length<2){showAlert('❌ File CSV kosong atau tidak valid','error');return;}
    const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());
    const required=['type','tanggal','region','tabung','status','qty'];
    const missing=required.filter(r=>!headers.includes(r));
    if(missing.length){showAlert(`❌ Kolom wajib tidak ditemukan: ${missing.join(', ')}`,'error');return;}
    const validRegions=S.regions||REGIONS;
    // Filter dari dropdown
    const regFilter=document.getElementById('import-region-filter')?.value||'';
    const typeFilter=document.getElementById('import-type-filter')?.value||'';
    const rows=[];
    for(let i=1;i<lines.length;i++){
      const vals=lines[i].split(',').map(v=>v.trim());
      const get=col=>{ const idx=headers.indexOf(col); return idx>=0?(vals[idx]||''):''; };
      const row={
        line:i+1,type:get('type').toLowerCase(),tanggal:get('tanggal'),region:get('region'),
        noSj:get('no_sj'),pihak:get('pihak'),tabung:get('tabung'),status:get('status').toUpperCase(),
        qty:parseInt(get('qty'))||0,ket:get('keterangan'),valid:true,errors:[]
      };
      if(!['masuk','keluar'].includes(row.type)) row.errors.push('type tidak valid');
      if(!row.tanggal.match(/^\d{4}-\d{2}-\d{2}$/)) row.errors.push('tanggal tidak valid (YYYY-MM-DD)');
      if(!validRegions.includes(row.region)) row.errors.push(`region "${row.region}" tidak ditemukan`);
      if(!TABUNGS.includes(row.tabung)) row.errors.push(`tabung "${row.tabung}" tidak valid`);
      if(!STATUSES.includes(row.status)) row.errors.push(`status "${row.status}" tidak valid`);
      if(row.qty<=0) row.errors.push('qty harus > 0');
      if(row.errors.length) row.valid=false;
      // Apply dropdown filters untuk tampilan (bukan validasi)
      row.filteredOut=false;
      if(regFilter && row.region!==regFilter) row.filteredOut=true;
      if(typeFilter && row.type!==typeFilter) row.filteredOut=true;
      rows.push(row);
    }
    importRows=rows;
    const displayed=rows.filter(r=>!r.filteredOut);
    const valid=displayed.filter(r=>r.valid).length;
    const invalid=displayed.filter(r=>!r.valid).length;
    document.getElementById('import-preview').style.display='block';
    document.getElementById('import-summary').innerHTML=
      `<b>Total: ${displayed.length} baris</b>${regFilter?` (Region: <b>${regFilter}</b>)`:''}${typeFilter?` (Tipe: <b>${typeFilter}</b>)`:''}
      &nbsp;|&nbsp;<span style="color:#10b981">✅ Valid: ${valid}</span>&nbsp;|&nbsp;<span style="color:#ef4444">❌ Error: ${invalid}</span>`;
    if(invalid>0){
      const errHtml=displayed.filter(r=>!r.valid).slice(0,5).map(r=>
        `<div style="font-size:11px;color:#ef4444;margin-bottom:3px">⚠️ Baris ${r.line}: ${r.errors.join(', ')}</div>`
      ).join('')+(invalid>5?`<div style="font-size:11px;color:var(--muted)">...dan ${invalid-5} error lainnya</div>`:'');
      document.getElementById('import-error-list').innerHTML=
        `<div style="background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 12px;margin-bottom:10px">${errHtml}</div>`;
    } else { document.getElementById('import-error-list').innerHTML=''; }
    const tblRows=displayed.map(r=>`<tr style="${r.valid?'':'background:rgba(239,68,68,.06)'}">
      <td>${r.line}</td>
      <td>${r.valid?'<span style="color:#10b981">✅</span>':'<span style="color:#ef4444" title="'+r.errors.join(', ')+'">❌</span>'}</td>
      <td><span class="badge badge-${r.type}">${r.type==='masuk'?'📥':'📤'} ${r.type}</span></td>
      <td>${r.tanggal}</td><td>${r.region}</td><td>${r.noSj||'-'}</td><td>${r.pihak||'-'}</td>
      <td style="font-size:11px">${r.tabung}</td>
      <td><span class="badge badge-${r.status.toLowerCase()}">${r.status}</span></td>
      <td><b>${r.qty}</b></td><td style="font-size:11px">${r.ket||'-'}</td>
    </tr>`).join('');
    document.getElementById('import-preview-tbl').innerHTML=
      `<tr><th>#</th><th>Status</th><th>Tipe</th><th>Tanggal</th><th>Region</th><th>No.SJ</th><th>Pihak</th><th>Tabung</th><th>Status Tab</th><th>QTY</th><th>Keterangan</th></tr>${tblRows}`;
    document.getElementById('btn-import-confirm').disabled=valid===0;
  };
  reader.readAsText(file,'UTF-8');
}

function resetImport(){ importRows=[]; document.getElementById('import-preview').style.display='none'; document.getElementById('import-error-list').innerHTML=''; }

function confirmImport(){
  const regFilter=document.getElementById('import-region-filter')?.value||'';
  const typeFilter=document.getElementById('import-type-filter')?.value||'';
  let validRows=importRows.filter(r=>r.valid&&!r.filteredOut);
  if(!validRows.length){showAlert('❌ Tidak ada data valid untuk diimport','error');return;}
  showConfirm({
    ico:'📂',title:'Konfirmasi Import CSV',
    msg:`Akan mengimport <b>${validRows.length} baris</b> data${regFilter?` untuk region <b>${regFilter}</b>`:''}.${typeFilter?`<br>Tipe: <b>${typeFilter}</b>`:''}<br><br>Data ini akan ditambahkan ke database. Lanjutkan?`,
    confirmLabel:'Ya, Import Sekarang',
    confirmClass:'btn-primary',
    onConfirm:doImportCSV
  });
}

async function doImportCSV(){
  const validRows=importRows.filter(r=>r.valid&&!r.filteredOut);
  let sukses=0, gagal=0;
  for(const row of validRows){
    try{
      const d=new Date(row.tanggal);
      const tx={id:gid(),type:row.type,region:row.region,tanggal:row.tanggal,noSj:row.noSj,
        pihak:row.pihak,tabung:row.tabung,status:row.status,qty:row.qty,ket:row.ket,
        monthIdx:d.getMonth(),year:d.getFullYear(),createdAt:Date.now()};
      S.transactions.push(tx);
      await saveTx(tx);
      sukses++;
    }catch(e){ gagal++; }
  }
  importRows=[];
  document.getElementById('import-preview').style.display='none';
  if(gagal>0) showAlert(`⚠️ Import selesai: ${sukses} berhasil, ${gagal} gagal`,'error');
  else showAlert(`✅ Import berhasil! ${sukses} transaksi ditambahkan`);
  await writeLog('IMPORT_CSV',`Import ${sukses} transaksi berhasil${gagal>0?', '+gagal+' gagal':''}`);
  page='riwayat'; render();
}

  if(!inp)return;
  const name=inp.value.trim();
  if(!name){showAlert('❌ Nama region tidak boleh kosong','error');return;}

  S.regions.push(name);
  REGIONS.splice(0,REGIONS.length,...S.regions);
  await saveRegions();
  modalSt=null;
  await writeLog('TAMBAH_REGION',`Region baru: "${name}"`);

async function saveEditRegion(){
  const idx=modalSt.idx;
  const inp=document.getElementById('m-reg-edit');
  if(!inp) return;
  const newName=inp.value.trim();
  const oldName=S.regions[idx];
  if(!newName){showAlert('❌ Nama region tidak boleh kosong','error');return;}
  if(newName===oldName){modalSt=null;render();return;}
  if(S.regions.includes(newName)){showAlert('❌ Nama region sudah ada!','error');return;}
  S.regions[idx]=newName;
  S.transactions.forEach(t=>{ if(t.region===oldName)t.region=newName; });
  S.users.forEach(u=>{ if(u.region===oldName)u.region=newName; });
  const newStok={};
  Object.entries(S.stokAwal).forEach(([k,v])=>{ newStok[k.replace(oldName+'_',newName+'_')]=v; });
  S.stokAwal=newStok;
  if(me&&me.region===oldName){ me.region=newName; sessionStorage.setItem('lpg_me',JSON.stringify(me)); }
  REGIONS.splice(0,REGIONS.length,...S.regions);
  await updateTxRegion(oldName,newName);
  await saveRegions();
  await writeLog('RENAME_REGION',`"${oldName}" → "${newName}"`);
  modalSt=null;
  showAlert(`✅ Region "${oldName}" berhasil diubah menjadi "${newName}"`);
}

function openEditUser(id){ const u=S.users.find(x=>x.id===id); if(!u)return; modalSt={t:'editUser',userId:id}; render(); }

function confirmDelUser(id){
  const u=S.users.find(x=>x.id===id);
  showConfirm({
    ico:'🗑️',title:'Hapus User',
    msg:`Yakin hapus user <b>${u?u.name:''}</b> (${u?u.username:''})?<br>Tindakan ini tidak bisa dibatalkan.`,
    confirmLabel:'Ya, Hapus User',
    confirmClass:'btn-danger',
    onConfirm:async()=>{
      await deleteUser(id);
      if(u) await writeLog('HAPUS_USER',`User dihapus: ${u.name} (${u.username}) – ${u.role}${u.region?' – '+u.region:''}`);
      showAlert('🗑️ User dihapus');
      render();
    }
  });
}

        <div style="margin-bottom:14px;padding:8px 12px;background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.2);border-radius:7px;font-size:12px;color:#f97316">

          <button class="btn btn-primary" onclick="saveEditRegion()">💾 Simpan Perubahan</button>

          <select id="mr" onchange="document.getElementById('mrw').style.display=this.value==='superadmin'?'none':'block'">
            <option value="operator">Operator</option>
            <option value="superadmin">Super Admin</option>
          </select>

async function saveNewUser(){
  const name=document.getElementById('mn').value.trim();
  const username=document.getElementById('mu').value.trim();
  const password=document.getElementById('mp').value.trim();
  const role=document.getElementById('mr').value;
  const region=role==='superadmin'?null:document.getElementById('mreg').value;
  if(!name||!username||!password){showAlert('❌ Semua field wajib diisi!','error');return;}
  if(S.users.find(u=>u.username===username)){showAlert('❌ Username sudah dipakai!','error');return;}
  if(!confirm(`Tambah user baru "${name}" (${username}) sebagai ${role==='superadmin'?'Super Admin':'Operator'}${region?' di region '+region:''}?`)) return;
  const newUser={id:gid(),username,password,name,role,region};
  S.users.push(newUser);
  if(useSupabase) await SB.from('lpg_users').insert({id:newUser.id,username,password,name,role,region:region||null});
  await writeLog('TAMBAH_USER',`User baru: ${name} (${username}) – ${role}${region?' – '+region:''}`);
  modalSt=null; showAlert('✅ User berhasil ditambahkan!');
}

async function saveEditUser(id){
  const u=S.users.find(x=>x.id===id);
  if(!u){showAlert('❌ User tidak ditemukan','error');return;}
  const newName=document.getElementById('eu-name').value.trim();
  const newUser=(id==='sa')?u.username:document.getElementById('eu-user').value.trim();
  const newPass=document.getElementById('eu-pass').value.trim();
  const newRole=(id==='sa')?u.role:document.getElementById('eu-role').value;
  const newRegion=newRole==='superadmin'?null:document.getElementById('eu-reg').value;
  if(!newName||!newUser){showAlert('❌ Nama dan username tidak boleh kosong','error');return;}
  if(S.users.find(x=>x.username===newUser&&x.id!==id)){showAlert('❌ Username sudah dipakai user lain!','error');return;}
  const changes=[];
  if(u.name!==newName) changes.push(`Nama: "${u.name}"→"${newName}"`);
  if(u.username!==newUser) changes.push(`Username: "${u.username}"→"${newUser}"`);
  if(newPass) changes.push('Password diubah');
  if(u.role!==newRole) changes.push(`Role: ${u.role}→${newRole}`);
  if((u.region||'')!==(newRegion||'')) changes.push(`Region: "${u.region||'—'}"→"${newRegion||'—'}"`);
  if(!changes.length){showAlert('Tidak ada perubahan','error');return;}
  if(!confirm(`Simpan perubahan untuk user "${newName}"?\n${changes.join('\n')}`)) return;
  u.name=newName; u.username=newUser;
  if(newPass) u.password=newPass;
  u.role=newRole; u.region=newRegion;
  if(me&&me.id===id){ me.name=newName; me.username=newUser; me.role=newRole; me.region=newRegion; if(newPass)me.password=newPass; sessionStorage.setItem('lpg_me',JSON.stringify(me)); }
  if(useSupabase){
    const upd={name:u.name,username:u.username,role:u.role,region:u.region||null};
    if(newPass) upd.password=u.password;
    await SB.from('lpg_users').update(upd).eq('id',id);
  }
  await writeLog('EDIT_USER',`Edit user ${newUser} (${id}): ${changes.join(' | ')}`);
  modalSt=null;
  showAlert(`✅ Data user "${newName}" berhasil diperbarui!`);
}

/* ===== ACTIVITY LOG ===== */
const ACTION_LABELS={
  'LOGIN':{ico:'🔐',label:'Login',color:'#60a5fa'},
  'LOGOUT':{ico:'🚪',label:'Logout',color:'#8b91a7'},
  'BARANG_MASUK':{ico:'📥',label:'Barang Masuk',color:'#34d399'},
  'BARANG_KELUAR':{ico:'📤',label:'Barang Keluar',color:'#f87171'},
  'HAPUS_TRANSAKSI':{ico:'🗑️',label:'Hapus Transaksi',color:'#ef4444'},
  'TAMBAH_REGION':{ico:'🗂️',label:'Tambah Region',color:'#f97316'},
  'RENAME_REGION':{ico:'✏️',label:'Rename Region',color:'#f97316'},
  'HAPUS_REGION':{ico:'🗑️',label:'Hapus Region',color:'#ef4444'},
  'TAMBAH_USER':{ico:'👤',label:'Tambah User',color:'#a78bfa'},
  'EDIT_USER':{ico:'✏️',label:'Edit User',color:'#f59e0b'},
  'HAPUS_USER':{ico:'🗑️',label:'Hapus User',color:'#ef4444'},
  'IMPORT_CSV':{ico:'📂',label:'Import CSV',color:'#eab308'},
  'UBAH_STOK_AWAL':{ico:'📦',label:'Ubah Stok Awal',color:'#818cf8'},
};

let actLogData=[], actLogLoading=false;
let actLogFilter={user:'',action:'',dateFrom:'',dateTo:''};

async function loadActLog(){ actLogLoading=true; render(); const {data}=await SB.from('lpg_activity_log').select('*').order('created_at',{ascending:false}).limit(1000); actLogData=data||[]; actLogLoading=false; render(); }

function renderActivityLog(){
  if(me.role!=='superadmin') return `<div class="card"><p style="color:var(--muted);text-align:center;padding:32px">🚫 Hanya Super Admin yang bisa melihat log aktivitas.</p></div>`;
  if(actLogLoading) return `<div class="card"><p style="color:var(--muted);text-align:center;padding:32px">⏳ Memuat log aktivitas...</p></div>`;
  if(!actLogData.length&&!actLogLoading){ setTimeout(loadActLog,0); return `<div class="card"><p style="color:var(--muted);text-align:center;padding:32px">⏳ Memuat log aktivitas...</p></div>`; }
  let filtered=actLogData;
  if(actLogFilter.user) filtered=filtered.filter(l=>l.username===actLogFilter.user||l.name.toLowerCase().includes(actLogFilter.user.toLowerCase()));
  if(actLogFilter.action) filtered=filtered.filter(l=>l.action===actLogFilter.action);
  if(actLogFilter.dateFrom) filtered=filtered.filter(l=>l.created_at>=actLogFilter.dateFrom);
  if(actLogFilter.dateTo) filtered=filtered.filter(l=>l.created_at<=actLogFilter.dateTo+'T23:59:59');
  const users=[...new Set(actLogData.map(l=>l.username))];
  const actions=[...new Set(actLogData.map(l=>l.action))];
  const userOpts=`<option value="">Semua User</option>`+users.map(u=>`<option value="${u}" ${actLogFilter.user===u?'selected':''}>${u}</option>`).join('');
  const actionOpts=`<option value="">Semua Aksi</option>`+actions.map(a=>{ const lb=ACTION_LABELS[a]; return `<option value="${a}" ${actLogFilter.action===a?'selected':''}>${lb?lb.ico+' '+lb.label:a}</option>`; }).join('');
  const rows=filtered.length?filtered.map(l=>{
    const al=ACTION_LABELS[l.action]||{ico:'📌',label:l.action,color:'var(--muted)'};
    const dt=new Date(l.created_at);
    const tgl=dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
    const jam=dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `<tr>
      <td style="white-space:nowrap;font-size:11px"><b>${tgl}</b><br><span style="color:var(--muted)">${jam}</span></td>
      <td><b style="color:var(--text)">${l.name}</b><br><span style="font-size:10px;color:var(--muted)">${l.username} · ${l.role==='superadmin'?'⚡ Super Admin':'👷 Operator'}</span></td>
      <td style="white-space:nowrap"><span style="font-size:11px;font-weight:600;color:${al.color}">${al.ico} ${al.label}</span></td>
      <td style="font-size:11px;color:var(--muted);max-width:300px">${l.detail||'-'}</td>
      <td style="font-size:11px;color:var(--muted)">${l.region||'—'}</td>
    </tr>`;
  }).join(''):`<tr><td colspan="5" class="empty"><div class="ico">📭</div>Tidak ada log ditemukan</td></tr>`;
  return `
  <div class="stats-grid" style="margin-bottom:14px">
    <div class="stat-card stat-blue"><div class="val">${actLogData.length}</div><div class="lbl">Total Log</div></div>
    <div class="stat-card stat-green"><div class="val">${actLogData.filter(l=>l.action==='LOGIN').length}</div><div class="lbl">Login</div></div>
    <div class="stat-card stat-orange"><div class="val">${actLogData.filter(l=>l.action==='BARANG_MASUK'||l.action==='BARANG_KELUAR').length}</div><div class="lbl">Transaksi</div></div>
    <div class="stat-card stat-red"><div class="val">${actLogData.filter(l=>l.action==='EDIT_USER'||l.action==='TAMBAH_USER'||l.action==='HAPUS_USER').length}</div><div class="lbl">Perubahan User</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select style="padding:6px 10px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)" onchange="actLogFilter.user=this.value;render()">${userOpts}</select>
        <select style="padding:6px 10px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)" onchange="actLogFilter.action=this.value;render()">${actionOpts}</select>
        <input type="date" style="padding:5px 9px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)" value="${actLogFilter.dateFrom}" onchange="actLogFilter.dateFrom=this.value;render()">
        <input type="date" style="padding:5px 9px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)" value="${actLogFilter.dateTo}" onchange="actLogFilter.dateTo=this.value;render()">
        <button class="btn btn-ghost btn-sm" onclick="actLogFilter={user:'',action:'',dateFrom:'',dateTo:''};render()">↺ Reset</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:12px;color:var(--muted)">${filtered.length} / ${actLogData.length} log</span>
        <button class="btn btn-ghost btn-sm" onclick="actLogData=[];loadActLog()">🔄 Refresh</button>
        <button class="btn btn-warn btn-sm" onclick="exportLogCSV()">⬇ Export CSV</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="monitor-wrap">
      <table class="riwayat-tbl">
        <tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Detail</th><th>Region</th></tr>
        ${rows}
      </table>
    </div>
  </div>`;
}

function exportLogCSV(){
  if(!actLogData.length){showAlert('Tidak ada data log','error');return;}
  let filtered=actLogData;
  if(actLogFilter.user) filtered=filtered.filter(l=>l.username===actLogFilter.user||l.name.toLowerCase().includes(actLogFilter.user.toLowerCase()));
  if(actLogFilter.action) filtered=filtered.filter(l=>l.action===actLogFilter.action);
  if(actLogFilter.dateFrom) filtered=filtered.filter(l=>l.created_at>=actLogFilter.dateFrom);
  if(actLogFilter.dateTo) filtered=filtered.filter(l=>l.created_at<=actLogFilter.dateTo+'T23:59:59');
  const header='Waktu,Pengguna,Username,Role,Aksi,Detail,Region\n';
  const rows=filtered.map(l=>{
    const dt=new Date(l.created_at).toLocaleString('id-ID');
    const al=ACTION_LABELS[l.action]||{label:l.action};
    return `"${dt}","${l.name}","${l.username}","${l.role==='superadmin'?'Super Admin':'Operator'}","${al.label}","${(l.detail||'').replace(/"/g,"'")}","${l.region||'—'}"`;
  }).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(header+rows);
  a.download=`activity-log-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  showAlert('✅ Log berhasil diekspor');
}

/* ===== BOOT ===== */
boot();
